<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetworkQuest</title>
<style>
  @font-face { font-family:"Inter"; font-style:normal; font-weight:400 800; font-display:swap; src:url(/fonts/inter-latin.woff2) format("woff2"); }
  /* Tokens follow DESIGN.md: warm paper and ink, indigo for action and goals, amber for notes owed. */
  :root {
    --bg:#f3f1ec; --card:#fffdf9; --ink:#23221f; --muted:#67635b; --line:#e2ddd2;
    --accent:#4f5bd5; --accent-soft:#eceefd; --accent-ink:#ffffff; --accent-hover:#3f4ac0;
    --warn:#9a5516; --warn-soft:#fbf0e3; --danger:#b8423a;
    --done:#dcd7cc; --done-ink:#3a3833;
    --t1:#eef3ec; --t2:#eef1f8; --t3:#f8f0ea; --t4:#f3eef7;
    --shadow:0 1px 2px rgba(40,35,25,.04), 0 4px 16px rgba(40,35,25,.05);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#151513; --card:#1d1d1a; --ink:#ebe8e1; --muted:#a29d93; --line:#2e2d29;
    --accent:#8f98ff; --accent-soft:#25274a; --accent-ink:#11132b; --accent-hover:#a7aeff;
    --warn:#e0a464; --warn-soft:#33281b; --danger:#e07a72;
    --done:#4a4840; --done-ink:#ece8df;
    --t1:#1c241c; --t2:#1b2029; --t3:#28201b; --t4:#231e29;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-feature-settings:"cv11", "ss01"; -webkit-font-smoothing:antialiased; }
  ::selection { background:color-mix(in srgb, var(--accent) 28%, transparent); color:var(--ink); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a { text-underline-offset:3px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .ic { width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; }
  header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 24px;
    background:color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; font-weight:700; letter-spacing:-.01em; margin:0 14px 0 0; }
  header h1 span { color:var(--accent); }
  nav { display:flex; gap:2px; background:var(--card); border:1px solid var(--line); padding:3px; border-radius:11px; }
  nav button { background:none; border:0; padding:5px 12px; color:var(--muted); font:inherit; font-size:14px; cursor:pointer; border-radius:8px; }
  nav button.on { color:var(--ink); background:var(--bg); font-weight:600; }
  .spacer { flex:1; }
  main { max-width:1080px; margin:0 auto; padding:24px 24px 64px; }
  h2 { font-size:18px; font-weight:700; letter-spacing:-.015em; color:var(--ink); margin:36px 0 12px; }
  h4 { font-size:14px; font-weight:650; letter-spacing:-.005em; color:var(--ink); margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow); }
  .list { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:12px; }
  .stack > * + * { margin-top:10px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:13px; }
  .tag { font-size:12px; padding:2px 9px; border-radius:99px; background:var(--bg); color:var(--muted); white-space:nowrap; }
  .tag.warn { color:var(--warn); background:var(--warn-soft); }
  .tag.new { color:var(--accent); background:var(--accent-soft); font-weight:600; }
  button.btn, a.btn { display:inline-flex; align-items:center; white-space:nowrap; text-decoration:none; }
  button.btn, a.btn { font:inherit; font-size:13px; padding:6px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; gap:6px; transition:background .2s cubic-bezier(.16,1,.3,1), border-color .2s cubic-bezier(.16,1,.3,1); }
  button.btn:disabled { opacity:.55; cursor:default; }
  button.btn:hover, a.btn:hover { border-color:color-mix(in srgb, var(--accent) 40%, var(--line)); }
  button.primary, a.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  button.primary:hover, a.btn.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
  button.danger { color:var(--danger); }
  button.ghost { border-color:transparent; background:transparent; color:var(--muted); }
  input, textarea, select { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
  input:focus, textarea:focus, select:focus { outline:2px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset:0; border-color:var(--accent); }
  textarea { min-height:70px; resize:vertical; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 5px; }
  .link { color:var(--accent); cursor:pointer; }
  .link:hover { text-decoration:underline; }
  pre { white-space:pre-wrap; font:12.5px/1.55 ui-monospace, "Cascadia Code", monospace; margin:8px 0 0; color:var(--muted); }
  .empty { color:var(--muted); font-size:14px; padding:6px 0; }
  details summary { cursor:pointer; list-style:none; }
  details summary::-webkit-details-marker { display:none; }

  /* Bento grids */
  .bento { display:grid; gap:12px; grid-template-columns:repeat(4, 1fr); grid-auto-flow:dense; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; box-shadow:var(--shadow); min-width:0; }
  .tile.span2 { grid-column:span 2; } .tile.span3 { grid-column:span 3; } .tile.span4 { grid-column:span 4; } .tile.tall { grid-row:span 2; }
  .tile.t1 { background:var(--t1); } .tile.t2 { background:var(--t2); } .tile.t3 { background:var(--t3); } .tile.t4 { background:var(--t4); }
  .tile .kicker { font-size:14px; font-weight:650; color:var(--ink); margin-bottom:8px; }
  .tile p { margin:0 0 10px; } .tile p:last-child { margin-bottom:0; }
  .tile.tall3 { grid-row:span 3; }
  /* Month calendar tile */
  .cal-head { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .cal-title { font-size:18px; font-weight:700; letter-spacing:-.01em; flex:1; }
  .cal-grid { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:4px; }
  .cal-dow { font-size:12px; font-weight:600; color:var(--muted); text-align:center; padding:2px 0 4px; }
  .cal-day { min-height:64px; border-radius:11px; padding:5px 6px; background:var(--bg); display:flex; flex-direction:column; gap:3px; min-width:0; }
  .cal-day.out { background:transparent; opacity:.4; }
  .cal-day .n { font-size:12px; color:var(--muted); font-weight:600; }
  .cal-day.today { outline:2px solid var(--ink); outline-offset:-2px; }
  .cal-day.today .n { color:var(--ink); }
  .chip { display:flex; align-items:center; gap:4px; font-size:11px; line-height:1.2; padding:2px 5px; border-radius:7px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .chip:hover { filter:brightness(.96); }
  .chip.needs { background:var(--warn-soft); color:var(--warn); }
  .chip.done { background:var(--done); color:var(--done-ink); }
  .chip .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  .legend { display:flex; gap:12px; margin-top:10px; flex-wrap:wrap; }
  .legend span { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); }
  .legend i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  /* Boardy tab, Gmail-style: list on the left, reading pane on the right, both scroll on their own. */
  .mail { display:grid; grid-template-columns:minmax(300px, 380px) minmax(0, 1fr); height:calc(100vh - 110px); margin:-8px 0 -40px;
    background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
  .mail-side { display:flex; flex-direction:column; gap:8px; padding:14px; border-right:1px solid var(--line); min-height:0; }
  .compose-btn { align-self:flex-start; padding:10px 18px !important; border-radius:14px !important; font-weight:600; }
  .mail-list { overflow:auto; flex:1; margin:0 -14px -14px; border-top:1px solid var(--line); }
  .mail-row { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; min-width:0; }
  .mail-row:hover { background:var(--bg); }
  .mail-row.active { background:var(--accent-soft); }
  .mail-row .who { font-size:13px; color:var(--muted); }
  .mail-row .when { font-size:12px; color:var(--muted); white-space:nowrap; }
  .mail-row .subj { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .mail-row .snip { font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mail-row.unread .who, .mail-row.unread .subj, .mail-row.unread .when { color:var(--ink); font-weight:700; }
  .mail-row.unread { box-shadow:inset 3px 0 0 var(--accent); }
  .mail-pane { overflow:auto; display:flex; min-height:0; }
  .mail-read { padding:22px 28px 28px; width:100%; max-width:900px; }
  .mail-msg { padding:14px 0; border-bottom:1px solid var(--line); }
  .mail-body { white-space:pre-wrap; margin:10px 0 0 42px; font-size:14.5px; line-height:1.6; }
  .mail-reply { margin-top:18px; }
  .mail-field { padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  @media (max-width:860px) { .mail { grid-template-columns:1fr; height:auto; } .mail-side { border-right:0; } .mail-list { max-height:40vh; } }
  .suggest { font:inherit; font-size:13px; padding:6px 11px; border-radius:99px; border:1px dashed var(--line); background:transparent; color:var(--muted); cursor:pointer; text-align:left; }
  .suggest:hover { color:var(--ink); border-color:var(--accent); }
  /* Person page */
  .phead { padding:22px 28px 18px; }
  .ptitle { font-size:15px; color:var(--ink); opacity:.85; margin-top:2px; }
  span.chip { font-size:12px; padding:3px 9px; border-radius:99px; display:inline-flex; cursor:default; }
  .chip.warn { background:var(--warn-soft); color:var(--warn); }
  .pleft { padding:24px 28px 32px !important; }
  .pcol { max-width:1040px; }
  /* Boardy's brief, scannable: lead line + bullets; follow-up and "why" side by side, then the two profile cards. */
  .brief-top { display:grid; grid-template-columns:minmax(0, 1.4fr) minmax(0, 1fr); gap:12px; margin-bottom:12px; }
  .brief-top:has(> :only-child) { grid-template-columns:1fr; }
  .brief-cols { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; }
  .brief-cols:has(> :only-child) { grid-template-columns:1fr; }
  .brief-card, .why { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
  .why { background:var(--t4); border-color:transparent; }
  .callout { margin-bottom:0 !important; }
  .lead { font-size:15.5px; line-height:1.55; font-weight:500; color:var(--ink); }
  .pts { margin:10px 0 0; padding-left:18px; display:flex; flex-direction:column; gap:6px; }
  .pts li { font-size:14px; line-height:1.55; color:color-mix(in srgb, var(--ink) 82%, var(--muted)); }
  .pts li::marker { color:var(--muted); }
  .lead b, .pts b { font-weight:700; color:var(--ink); }
  .more { margin-top:6px; }
  .more summary { cursor:pointer; font-size:13px; color:var(--accent); list-style:none; padding:2px 0; }
  .more summary::-webkit-details-marker { display:none; }
  .more[open] summary { display:none; }
  @media (max-width:1250px) { .brief-top, .brief-cols { grid-template-columns:1fr; } }
  .pcol h4, .pright h4 { margin:0 0 10px; }
  .callout { background:var(--accent-soft); border-radius:14px; padding:14px 18px; margin-bottom:14px; font-size:15px; line-height:1.65; }
  .callout p { margin:0 0 8px; } .callout p:last-child { margin:0; }
  .article { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:6px 22px 14px; font-size:15px; line-height:1.7; }
  .article section { padding:14px 0; border-bottom:1px solid var(--line); }
  .article p { margin:0 0 10px; } .article p:last-child { margin-bottom:0; }
  .sec-label { font-size:14px; font-weight:650; color:var(--ink); margin:0 0 6px; }
  .src-line { padding-top:10px; font-size:13px; }
  .pempty { border:1.5px dashed var(--line); border-radius:16px; padding:28px; text-align:center; }
  .tl-list { border:1px solid var(--line); border-radius:14px; background:var(--card); overflow:hidden; }
  .tl { display:grid; grid-template-columns:110px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  .tl:last-child { border-bottom:0; }
  .tl-date { font-size:13px; color:var(--muted); white-space:nowrap; }
  .tl-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; }
  .sources { margin-top:28px; }
  .pright { padding:24px 24px 32px !important; }
  .steps { display:flex; flex-direction:column; gap:8px; }
  .step { display:flex; gap:10px; align-items:flex-start; margin:0; color:var(--ink); font-size:14px; cursor:pointer; }
  .step input { width:16px; height:16px; flex:none; margin-top:3px; accent-color:var(--accent); }
  .composer { display:flex; flex-direction:column; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; }
  .composer textarea { min-height:84px; border:0; background:transparent; padding:4px 6px; }
  .composer textarea:focus { outline:none; }
  .composer input, .composer select { font-size:13px; padding:7px 10px; }
  .note { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .note-body { white-space:pre-wrap; margin-top:4px; font-size:14px; line-height:1.6; }
  .note-actions { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .menu { position:relative; }
  .menu summary { list-style:none; } .menu summary::-webkit-details-marker { display:none; }
  .menu-pop { position:absolute; right:0; top:calc(100% + 6px); z-index:10; min-width:220px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.14); padding:6px; display:flex; flex-direction:column; }
  .menu-pop button { font:inherit; font-size:14px; text-align:left; padding:8px 10px; border:0; background:none; color:var(--ink); border-radius:8px; cursor:pointer; }
  .menu-pop button:hover { background:var(--bg); }
  .menu-pop button.danger { color:var(--danger); }
  .menu-pop hr { border:0; border-top:1px solid var(--line); margin:4px 0; }
  /* Prep, follow-up ideas, going quiet, opportunities */
  .prep-peek { margin-top:14px; padding-top:12px; border-top:1px solid color-mix(in srgb, var(--line) 70%, transparent); }
  .prep-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-top:10px; }
  .prep-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:18px; }
  .prep-grid:has(> :only-child) { grid-template-columns:1fr; }
  .idea { background:var(--t1); border-radius:14px; padding:12px 16px; margin-bottom:12px; font-size:14px; line-height:1.55; }
  .quiet-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap:8px 18px; margin-top:12px; }
  .quiet-row { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line); min-width:0; }
  .quiet-idea { font-size:13.5px; color:color-mix(in srgb, var(--ink) 80%, var(--muted)); margin-top:2px; line-height:1.5; }
  .opps { margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 16px; }
  .opps summary { cursor:pointer; list-style:none; } .opps summary::-webkit-details-marker { display:none; }
  .opp-list { margin-top:8px; display:flex; flex-direction:column; gap:2px; }
  .opp { display:flex; gap:10px; align-items:center; font-size:14px; padding:4px 0; }
  .opp input[type=checkbox] { width:16px; height:16px; flex:none; accent-color:var(--accent); }
  @media (max-width:1250px) { .prep-grid { grid-template-columns:1fr; } }
  .digest { display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }
  .digest .d { flex:1 1 180px; padding:10px 12px; border-radius:12px; background:var(--bg); min-width:0; }
  .digest .d b { display:block; font-size:22px; letter-spacing:-.01em; }
  .need-list { display:flex; flex-direction:column; margin-top:10px; }
  .need-row { display:flex; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); min-width:0; }
  .need-row:first-child { border-top:0; }
  .all-done { margin:14px 0 0; font-size:16px; font-weight:600; }
  .digest .d[data-tab] { cursor:pointer; } .digest .d[data-tab]:hover { background:color-mix(in srgb, var(--accent) 8%, var(--bg)); }
  @media (max-width:760px) { .need-row { flex-wrap:wrap; } .need-row > div:nth-child(2) { flex:1 1 calc(100% - 50px) !important; } .need-row .btn { flex:1; justify-content:center; }
    .digest { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; } .digest .d { padding:8px 10px; } .digest .d b { font-size:18px; } }
  .digest .d .who { font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat { font-size:34px; font-weight:700; letter-spacing:-.02em; line-height:1.1; }
  .stat-tile { cursor:pointer; transition:transform .15s; } .stat-tile:hover { transform:translateY(-1px); }
  .hero-name { font-size:22px; font-weight:700; letter-spacing:-.01em; margin:2px 0; }
  .avatar { width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font-weight:700; font-size:19px; color:var(--accent); background:var(--accent-soft); flex:none; }
  .avatar.sm { width:34px; height:34px; border-radius:11px; font-size:13px; }
  @media (max-width:760px) {
    .bento { grid-template-columns:repeat(2, 1fr); }
    .tile.span3, .tile.span4 { grid-column:span 2; }
    main, header { padding-left:16px; padding-right:16px; }
  }

  /* Brief text (used inside tiles and the brief editor) */
  .brief p { margin:0 0 10px; } .brief p:last-child { margin-bottom:0; }
  .brief .section { padding:12px 0; border-top:1px solid var(--line); } .brief .section:first-child { border-top:0; padding-top:0; }
  .brief .label { font-size:14px; font-weight:650; color:var(--ink); margin-bottom:4px; }

  dialog { border:0; border-radius:22px; background:var(--bg); color:var(--ink); width:min(1000px, calc(100vw - 32px)); max-height:90vh; padding:24px; box-shadow:0 24px 80px rgba(0,0,0,.25); }
  dialog.narrow { width:min(620px, calc(100vw - 32px)); }
  /* Person page on a laptop: near full-screen, brief on the left, my notes in a right column that stays in view. */
  dialog.wide { width:calc(100vw - 48px); max-width:1600px; height:calc(100vh - 48px); max-height:none; padding:0; overflow:hidden; }
  .pwrap { display:flex; flex-direction:column; height:100%; }
  .phead { padding:20px 24px 16px; border-bottom:1px solid var(--line); }
  .pgrid { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0, 1.75fr) minmax(360px, 1fr); }
  .pleft, .pright { overflow:auto; padding:20px 24px 28px; }
  .pright { border-left:1px solid var(--line); background:color-mix(in srgb, var(--card) 45%, var(--bg)); }
  .pright .tile { box-shadow:none; }
  @media (max-width:1100px) {
    dialog.wide { height:auto; max-height:92vh; overflow:auto; }
    .pwrap { height:auto; } .pgrid { grid-template-columns:1fr; }
    .pleft, .pright { overflow:visible; } .pright { border-left:0; border-top:1px solid var(--line); }
  }
  .status { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 12px); z-index:50; max-width:min(560px, calc(100vw - 32px));
    background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:12px; font-size:14px; line-height:1.45; box-shadow:0 10px 30px rgba(20,18,14,.25);
    display:flex; gap:12px; align-items:center; opacity:0; pointer-events:none; transition:opacity .25s cubic-bezier(.16,1,.3,1), transform .25s cubic-bezier(.16,1,.3,1); }
  .status.on { opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  .status.error { background:var(--danger); color:#fff; }
  .status button { font:inherit; font-size:13px; font-weight:600; background:none; border:0; color:inherit; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:0; }
  .synced { font-size:12px; color:var(--muted); white-space:nowrap; }
  .sent-mark { font-size:12px; color:var(--muted); margin-top:2px; } .sent-mark.no { color:var(--warn); font-weight:600; }
  [role=button] { cursor:pointer; }
  @media (prefers-reduced-motion: reduce) { .status { transition:none; } }
  dialog::backdrop { background:rgba(20,18,14,.45); backdrop-filter:blur(2px); }
</style>
</head>
<body>
<header>
  <h1>Network<span>Quest</span></h1>
  <nav id="tabs">
    <button data-tab="meetings" class="on">Meetings</button>
    <button data-tab="network">Network</button>
    <button data-tab="steps">Next steps</button>
    <button data-tab="boardy">Boardy</button>
  </nav>
  <span class="spacer"></span>
  <span class="synced" id="synced"></span><span class="muted" id="liveLabel"></span>
  <button class="btn" id="settings">Accounts &amp; Boardy</button>
  <button class="btn primary" id="sync">Sync</button>
</header>
<main id="view"></main>
<div class="status" id="status" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
// Escape, then turn http(s)://… and www.… into links that open in a new tab.
// Runs on already-escaped text, so trailing punctuation and &-entities are kept out of the URL.
function linkify(s) {
  // A URL ends at whitespace or an escaped quote/bracket (&quot; &#39; &lt; &gt;).
  return esc(s).replace(/\b((?:https?:\/\/|www\.)(?:(?!&quot;|&#39;|&lt;|&gt;)[^\s<>"'])+)/gi, url => {
    const trail = url.match(/(?:[.,;:!?)\]]|&#39;|&quot;)+$/)?.[0] || '';
    const clean = url.slice(0, url.length - trail.length);
    const href = clean.replace(/&amp;/g, '&');
    return `<a href="${esc(/^www\./i.test(href) ? 'https://' + href : href)}" target="_blank" rel="noopener noreferrer" class="link">${clean}</a>${trail}`;
  });
}
// Date-only strings ("2026-11-03") are a day on the calendar; read them as local noon so they never shift a day.
const fmt = d => {
  if (!d) return "";
  const dateOnly = d.length === 10;
  return new Date(dateOnly ? d + "T12:00:00" : d).toLocaleString([], { dateStyle: "medium", timeStyle: dateOnly ? undefined : "short" });
};
const fmtDay = d => (d ? new Date(d.length === 10 ? d + "T12:00:00" : d).toLocaleDateString([], { dateStyle: "medium" }) : "");
let S = null, tab = 'meetings';

// Drawn icons, one stroke weight. They're aria-hidden, so every control also carries a text label or aria-label.
const ICONS = {
  pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  left:'<path d="M15 5l-7 7 7 7"/>', right:'<path d="M9 5l7 7-7 7"/>',
  arrow:'<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>', close:'<path d="M6 6l12 12M18 6L6 18"/>',
  more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  live:'<circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>',
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

// One status line instead of pop-up alerts. Errors stay until dismissed; confirmations fade.
let statusTimer;
function notify(msg, kind = 'ok', action) {
  const el = $('#status');
  clearTimeout(statusTimer);
  el.className = 'status on' + (kind === 'error' ? ' error' : '');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" id="statusAct">${esc(action.label)}</button>` : ''}<button type="button" id="statusX" aria-label="Dismiss">${ic('close')}</button>`;
  if (action) $('#statusAct').onclick = () => { el.className = 'status'; action.run(); };
  $('#statusX').onclick = () => { el.className = 'status'; };
  if (kind !== 'error') statusTimer = setTimeout(() => { el.className = 'status'; }, 4500);
}
const isLocal = ['127.0.0.1', 'localhost'].includes(location.hostname);

// Clickable cards, rows and chips act like buttons for the keyboard too.
const CLICKABLE = '[data-person]:not(button):not(a), .mail-row, .stat-tile, .d[data-tab]';
function wireKeys() {
  document.querySelectorAll(CLICKABLE).forEach(el => { if (!el.hasAttribute('tabindex')) { el.tabIndex = 0; el.setAttribute('role', 'button'); } });
}
new MutationObserver(wireKeys).observe(document.body, { childList: true, subtree: true });
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[role=button]')) { e.preventDefault(); e.target.click(); }
});

async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'x-nq':'1', 'Content-Type':'application/json' }, body: body && JSON.stringify(body) });
  // A 404 with no body almost always means the server is an older version than this page.
  // Hosted app: the session ran out, so go sign in again.
  if (r.status === 401) { location.href = '/login'; throw new Error('Signed out'); }
  if (r.status === 404) throw new Error(isLocal
    ? 'The server is older than this page. Restart it (Ctrl+C, then npm run nq -- ui) and refresh.'
    : "This server doesn't have that feature yet. Refresh the page; if it keeps happening, redeploy.");
  const raw = await r.text();
  let j = null;
  try { j = raw ? JSON.parse(raw) : null; } catch { throw new Error(`Unexpected reply from the server (${r.status})`); }
  if (!r.ok) throw new Error(j?.error || `Server error ${r.status}`);
  return j;
}
const qs = o => '?' + new URLSearchParams(o);

async function load() { S = await api('/api/state'); render(); }

// Badges shown next to a person: unread Boardy email, or an Ask still waiting for an answer.
function badges(email) {
  if (S.unread[email]) return '<span class="tag new">New from Boardy</span>';
  if (S.waiting.includes(email)) return '<span class="tag">Waiting on Boardy</span>';
  return '';
}

function render() {
  $('#liveLabel').innerHTML = S.live ? `<span class="tag new">${ic('live')} Live</span>` : '';
  $('#liveLabel').title = S.live ? 'Boardy emails arrive here as soon as Gmail gets them' : '';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#view').innerHTML = { meetings, network, steps, boardy }[tab]();
  if (tab === 'boardy') loadChat();
}

// ---- Boardy tab: type anything to Boardy; it goes by email, and the replies show below. ----
let draftText = '';
// One general request for when there's nothing specific in mind; edit it freely before sending.
const TEMPLATE = `Hi Boardy,

I'd like to meet a few more people. Based on what you know about me and the intros so far, who would be worth connecting with next? Builders, founders or engineers I could learn from or work with are all good.

Thanks!`;

// Gmail-style Boardy tab: thread list on the left, reading pane (or compose) on the right.
let mail = { list: null, open: null, thread: null, composing: false, reply: '', filter: '' };

const mailTime = d => {
  const x = new Date(d), now = new Date();
  return x.toDateString() === now.toDateString() ? x.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    : x.toLocaleDateString([], { month: 'short', day: 'numeric', ...(x.getFullYear() !== now.getFullYear() ? { year: 'numeric' } : {}) });
};

function boardy() {
  return `<div class="mail">
    <aside class="mail-side">
      <button class="btn primary compose-btn" id="mCompose">${ic('pen')} Compose</button>
      <input id="mFilter" placeholder="Search Boardy mail" value="${esc(mail.filter)}">
      <div class="row muted" style="margin:6px 2px"><span>Inbox</span><span class="spacer"></span><button class="btn ghost" id="mRefresh" title="Refresh" aria-label="Refresh Boardy mail">${ic('refresh')}</button></div>
      <div id="mList" class="mail-list"><div class="empty" style="padding:12px">Loading…</div></div>
    </aside>
    <section id="mPane" class="mail-pane"></section>
  </div>`;
}

function renderList() {
  const el = $('#mList');
  if (!el || !mail.list) return;
  const q = mail.filter.toLowerCase();
  const rows = mail.list.filter(t => !q || (t.subject + ' ' + t.snippet).toLowerCase().includes(q));
  el.innerHTML = rows.map(t => `<div class="mail-row ${t.unread ? 'unread' : ''} ${mail.open?.id === t.id ? 'active' : ''}" data-thread="${esc(t.id)}" data-inbox="${esc(t.inbox)}">
      <div class="row" style="flex-wrap:nowrap;gap:6px"><span class="who">${t.fromBoardy ? 'Boardy' : 'Me'}${t.count > 1 ? ` <span class="muted">${t.count}</span>` : ''}</span>
        <span class="spacer"></span><span class="when">${mailTime(t.date)}</span></div>
      <div class="subj">${esc(t.subject)}</div>
      <div class="snip">${esc(t.snippet)}</div>
    </div>`).join('') || '<div class="empty" style="padding:12px">No mail.</div>';
}

function renderPane() {
  const el = $('#mPane');
  if (!el) return;
  if (mail.composing) {
    el.innerHTML = `<div class="mail-read">
      <div class="row"><h3 style="margin:0;font-size:18px">New message</h3><span class="spacer"></span><button class="btn ghost" id="mDiscard">Discard</button></div>
      <div class="mail-field"><span class="muted">From</span> ${esc(S.sendFrom || '(no account chosen)')}</div>
      <div class="mail-field"><span class="muted">To</span> ${esc(S.boardy || '(Boardy not set)')}</div>
      <input id="bSubj" placeholder="Subject (optional)" style="margin-top:10px">
      <textarea id="bMsg" style="min-height:300px;margin-top:10px;background:var(--card)" placeholder="Ask Boardy for new intros, follow up on someone, or tell it what you're looking for...">${esc(draftText)}</textarea>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="bSend">Send</button>
        <button class="suggest" id="bTemplate">Use the standard request</button></div>
    </div>`;
    return;
  }
  if (!mail.thread) {
    el.innerHTML = `<div class="empty" style="margin:auto;text-align:center">${mail.open ? 'Loading…' : 'Select a conversation, or Compose a new message.'}</div>`;
    return;
  }
  const t = mail.thread;
  el.innerHTML = `<div class="mail-read">
    <h3 style="margin:0 0 14px;font-size:20px;letter-spacing:-.01em">${esc(t.subject)}</h3>
    ${t.messages.map(m => `<div class="mail-msg">
      <div class="row" style="flex-wrap:nowrap"><div class="avatar sm" style="${m.mine ? '' : 'background:var(--done);color:var(--done-ink)'}">${m.mine ? 'Me' : 'B'}</div>
        <div style="flex:1;min-width:0"><strong style="font-weight:600">${m.mine ? 'Me' : 'Boardy'}</strong>
          <span class="muted" style="margin-left:6px">${esc(m.from.replace(/^.*</, '<'))}</span></div>
        <span class="muted">${fmt(m.date)}</span></div>
      <div class="mail-body">${linkify(m.text)}</div>
    </div>`).join('')}
    <div class="mail-reply">
      <div class="muted" style="margin-bottom:6px">Reply to Boardy from ${esc(t.inbox)}</div>
      <textarea id="mReply" style="min-height:110px;background:var(--card)" placeholder="Write a reply…">${esc(mail.reply)}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="mSendReply">Send reply</button></div>
    </div>
  </div>`;
}

async function loadChat() {
  renderList(); renderPane();
  try { mail.list = await api('/api/inbox'); renderList(); }
  catch (err) { const el = $('#mList'); if (el) el.innerHTML = `<div class="empty" style="padding:12px">${esc(err.message)}</div>`; }
  if (mail.open && !mail.composing) openMail(mail.open.inbox, mail.open.id, true);
}

async function openMail(inbox, id, keepScroll = false) {
  if (mail.open?.id !== id) mail.reply = '';
  mail.composing = false; mail.open = { inbox, id };
  if (!keepScroll) { mail.thread = null; renderPane(); }
  const row = mail.list?.find(t => t.id === id);
  if (row) row.unread = false;
  renderList();
  try { mail.thread = await api('/api/thread' + qs({ inbox, id })); renderPane(); }
  catch (err) { $('#mPane').innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
}

const initials = s => (s || '?').replace(/@.*/, '').split(/[\s._-]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
// "today", "tomorrow", "in 5 days", "3 days ago"
function rel(d) {
  const day = 86400000, a = new Date(d), b = new Date();
  const n = Math.round((new Date(a.toDateString()) - new Date(b.toDateString())) / day);
  return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : n > 0 ? `in ${n} days` : `${-n} days ago`;
}

function meetingCard(m) {
  const status = !m.past ? `<span class="tag">${rel(m.start)}</span>` : [
    m.hasBrief ? '<span class="tag">brief</span>' : '',
    m.hasNote ? '<span class="tag">my notes</span>' : '<span class="tag warn">needs notes</span>',
  ].join('');
  return `<div class="card">
    <div class="row" style="flex-wrap:nowrap"><div class="avatar sm">${esc(initials(m.name || m.email))}</div>
      <div style="min-width:0;flex:1"><div class="link" data-person="${esc(m.email)}" style="font-weight:600;color:var(--ink)">${esc(m.name || m.email)}</div>
      <div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.title)}</div></div></div>
    <div class="row" style="margin-top:10px">${status}${badges(m.email)}<span class="spacer"></span><span class="muted">${fmt(m.start)}</span></div>
    ${m.past ? '' : `<label>My goal for this call</label>
      <input data-goal="${esc(m.eventId)}" data-email="${esc(m.email)}" value="${esc(m.goal)}" placeholder="e.g. ask about winter co-op on their team">`}
    <div class="row" style="margin-top:12px">
      ${m.past ? `<button class="btn ${m.hasNote ? '' : 'primary'}" data-addnote="${esc(m.email)}" data-event="${esc(m.eventId)}">Add note</button>
        <button class="btn" data-brief="${esc(m.eventId)}" data-email="${esc(m.email)}">${m.hasBrief ? 'View brief' : 'Paste brief'}</button>
        ${m.hasBrief ? '' : `<button class="btn" data-ask="${esc(m.eventId)}" data-email="${esc(m.email)}">Ask Boardy</button>`}` : ''}
      <span class="spacer"></span><button class="btn ghost" data-person="${esc(m.email)}">Open ${ic('arrow')}</button>
    </div>
  </div>`;
}

// Month shown in the calendar tile, as an offset from the current month (arrows change it).
let calOffset = 0;

function calendarTile() {
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() + calOffset, 1);
  const month = first.getMonth();
  // Weeks start on Monday; pad back to the Monday on or before the 1st.
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const key = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  const day = m => new Date(m.start.length === 10 ? `${m.start}T12:00:00` : m.start); // date-only = that local day
  const byDay = {};
  for (const m of S.meetings) (byDay[key(day(m))] ||= []).push(m);
  const cls = m => (!m.past ? '' : m.hasNote ? 'done' : 'needs');
  const firstOf = m => (m.name || m.email).split(/[\s@]/)[0];
  const firstCount = {};
  for (const m of S.meetings) firstCount[firstOf(m)] = (firstCount[firstOf(m)] || 0) + 1;
  const shortName = m => { const f = firstOf(m), last = (m.name || '').trim().split(/\s+/)[1]; return firstCount[f] > 1 && last ? `${f} ${last[0]}.` : f; };
  const statusWord = m => (!m.past ? 'upcoming' : m.hasNote ? 'done' : 'needs notes');
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i >= 35 && d.getMonth() !== month) break; // drop a sixth row that is entirely next month
    const list = byDay[key(d)] || [];
    cells.push(`<div class="cal-day ${d.getMonth() !== month ? 'out' : ''} ${key(d) === key(now) ? 'today' : ''}">
      <span class="n">${d.getDate()}</span>
      ${list.map(m => `<div class="chip ${cls(m)}" data-person="${esc(m.email)}" title="${esc(`${m.name || m.email} · ${m.title} · ${fmt(m.start)}`)}">
        <span class="dot"></span>${esc(shortName(m))}<span class="sr">, ${statusWord(m)}</span></div>`).join('')}
    </div>`);
  }
  const inMonth = S.meetings.filter(m => day(m).getMonth() === month && day(m).getFullYear() === first.getFullYear()).length;
  return `<div class="tile span2">
    <div class="cal-head">
      <div class="cal-title">${first.toLocaleString([], { month: 'long', year: 'numeric' })}
        <span class="muted" style="font-weight:400;font-size:13px">· ${inMonth} meeting${inMonth === 1 ? '' : 's'}</span></div>
      <button class="btn ghost" data-cal="-1" title="Previous month" aria-label="Previous month">${ic('left')}</button>
      <button class="btn" data-cal="0">Today</button>
      <button class="btn ghost" data-cal="1" title="Next month" aria-label="Next month">${ic('right')}</button>
    </div>
    <div class="cal-grid">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells.join('')}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Upcoming</span><span><i style="background:var(--warn)"></i>Needs notes</span>
      <span><i style="background:var(--done-ink)"></i>Done</span></div>
  </div>`;
}

// "This week": the 7 days behind and ahead of today, in one line of tiles across the top of the dashboard.
function digestTile() {
  const now = Date.now(), wk = 7 * 86400000;
  const when = m => new Date(m.start.length === 10 ? `${m.start}T12:00:00` : m.start).getTime();
  const ahead = S.meetings.filter(m => !m.past && when(m) - now <= wk);
  const metNow = S.meetings.filter(m => m.past && now - when(m) <= wk);
  const unnoted = metNow.filter(m => !m.hasNote);
  const steps = S.nextSteps.filter(s => !s.done);
  const fresh = Object.keys(S.unread);
  const names = list => list.map(m => esc((m.name || m.email).split(/[\s@]/)[0])).join(', ');
  const nameOf = email => esc((S.people.find(p => p.email === email)?.name || email).split(/[\s@]/)[0]);
  const box = (n, label, who, go = '') => `<div class="d" ${go}><b>${n}</b>${label}${who ? `<div class="who">${who}</div>` : ''}</div>`;
  const start = new Date(now - wk + 86400000).toLocaleDateString([], { month: 'short', day: 'numeric' });
  const end = new Date(now + wk).toLocaleDateString([], { month: 'short', day: 'numeric' });
  return `<div class="tile span4">
    <div class="row"><div class="kicker" style="margin:0">This week · ${start} – ${end}</div><span class="spacer"></span>
      <span class="muted">${ahead.length || unnoted.length || fresh.length ? '' : 'A quiet week. A good time to ask Boardy for new intros.'}</span></div>
    <div class="digest">
      ${box(ahead.length, ` meeting${ahead.length === 1 ? '' : 's'} coming up`, names(ahead))}
      ${box(metNow.length, ` met in the last 7 days`, names(metNow))}
      ${box(unnoted.length, ` still need${unnoted.length === 1 ? 's' : ''} notes`, names(unnoted))}
      ${box(steps.length, ` open next step${steps.length === 1 ? '' : 's'}`, steps.slice(0, 2).map(s => esc(s.next_step)).join(' · '), 'data-tab="steps"')}
      ${box(fresh.length, ` new from Boardy`, fresh.map(nameOf).join(', '), 'data-tab="boardy"')}
    </div>
  </div>`;
}

// Bento dashboard: this week across the top; calendar on the left; next meeting and counts on the right.
function meetings() {
  if (!S.meetings.length) return '<div class="tile">No meetings yet. Press <strong>Sync</strong> to pull your calendar and Boardy emails.</div>';
  const up = S.meetings.filter(m => !m.past);
  const needs = S.meetings.filter(m => m.past && !m.hasNote).reverse();
  const next = up[0];

  const hero = next ? `<div class="tile span2 t2">
      <div class="kicker">Next up · ${rel(next.start)}</div>
      <div class="row" style="flex-wrap:nowrap;margin-top:6px"><div class="avatar">${esc(initials(next.name || next.email))}</div>
        <div style="min-width:0"><div class="hero-name link" data-person="${esc(next.email)}" style="color:var(--ink)">${esc(next.name || next.email)}</div>
        <div class="muted">${fmt(next.start)}</div></div></div>
      <div class="muted" style="margin-top:12px">${esc(next.title)}</div>
      <label>My goal for this call</label>
      <input data-goal="${esc(next.eventId)}" data-email="${esc(next.email)}" value="${esc(next.goal)}" placeholder="What do you want out of this one?">
      ${prepPeek(next)}
    </div>`
    : `<div class="tile span2 t2"><div class="kicker">Next up</div><div class="hero-name">Nothing booked</div>
      <div class="muted">Your next Boardy intro will show here.</div></div>`;
  // Needs notes sits beside Next up: the two jobs this screen exists for. Newest first; the rest fold away.
  const needRow = m => `<div class="need-row">
      <div class="avatar sm">${esc(initials(m.name || m.email))}</div>
      <div style="min-width:0;flex:1"><span class="link" data-person="${esc(m.email)}" style="font-weight:600;color:var(--ink)">${esc(m.name || m.email)}</span>
        <div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${fmtDay(m.start)} · ${esc(m.title)}</div></div>
      <button class="btn" data-brief="${esc(m.eventId)}" data-email="${esc(m.email)}">${m.hasBrief ? 'View brief' : 'Paste brief'}</button>
      <button class="btn primary" data-addnote="${esc(m.email)}" data-event="${esc(m.eventId)}">Add note</button>
    </div>`;
  const needsTile = `<div class="tile span2" id="needs">
      <div class="row"><h2 style="margin:0">Needs notes</h2><span class="tag ${needs.length ? 'warn' : ''}">${needs.length}</span></div>
      ${needs.length
        ? `<div class="need-list">${needs.slice(0, 5).map(needRow).join('')}</div>
           ${needs.length > 5 ? `<details class="more"><summary>Show ${needs.length - 5} more</summary><div class="need-list">${needs.slice(5).map(needRow).join('')}</div></details>` : ''}`
        : `<p class="all-done">All caught up. Every call so far has its notes.</p>`}
    </div>`;

  return `<div class="bento">
      ${digestTile()}
      ${hero}
      ${needsTile}
      ${calendarTile()}
      ${quietTile()}
    </div>`;
}

// Prep on the Next up tile: Boardy's talking points once they arrive; until then, its status.
function prepPeek(m) {
  if (m.prep) {
    const talk = blocks(m.prep, PREP_LABELS).find(b => b.label === 'Talking points');
    const items = talk ? listItems(talk.text).slice(0, 3) : [];
    return `<div class="prep-peek">
      <div class="row"><span class="sec-label" style="margin:0">Prep from Boardy</span><span class="spacer"></span>
        <button class="btn ghost" data-person="${esc(m.email)}">Open prep ${ic('arrow')}</button></div>
      ${items.length ? `<ul class="pts">${items.map(i => `<li>${linkify(i)}</li>`).join('')}</ul>` : ''}</div>`;
  }
  if (m.prepRequested) return `<div class="prep-peek muted">Boardy is preparing notes for this call. They'll appear here.</div>`;
  return `<div class="prep-peek row"><span class="muted">Prep is requested automatically 2 days before.</span><span class="spacer"></span>
    <button class="btn" data-prep="${esc(m.eventId)}" data-email="${esc(m.email)}">Prep me now</button></div>`;
}

// Going quiet: people with no contact in 2+ weeks, Boardy's follow-up idea beside each, and the monthly reconnect ask.
function quietTile() {
  const q = S.quiet || [];
  const pend = S.pending || {};
  const needIdeas = q.filter(p => !p.idea).length;
  const row = p => `<div class="quiet-row">
      <div class="avatar sm">${esc(initials(p.name || p.email))}</div>
      <div style="min-width:0;flex:1">
        <div class="row" style="gap:8px"><span class="link" data-person="${esc(p.email)}" style="font-weight:600;color:var(--ink)">${esc(p.name || p.email)}</span>
          <span class="muted">${p.days == null ? 'no contact on record' : `${p.days} days quiet`}</span>
          ${p.idea?.type === 'reconnect' ? '<span class="chip">Boardy: reconnect this month</span>' : ''}</div>
        ${p.idea ? `<div class="quiet-idea">${linkify(ideaLine(p.idea.body))}</div>` : ''}
      </div>
      ${p.email.endsWith('@no-email.boardy') ? '' : `<a class="btn ghost" href="${esc(composeUrl(p.email))}" target="_blank" rel="noopener noreferrer">Email</a>`}
    </div>`;
  return `<div class="tile span2">
    <div class="row"><div class="kicker" style="margin:0">Going quiet · ${q.length}</div><span class="spacer"></span>
      ${pend.followup ? '<span class="muted">Waiting for Boardy\'s ideas…</span>'
        : needIdeas ? `<button class="btn" data-followups="followup">Ask Boardy for follow-up ideas (${needIdeas})</button>` : ''}
      ${pend.reconnect ? '<span class="muted">Waiting for Boardy\'s picks…</span>'
        : '<button class="btn" data-followups="reconnect">Who should I reconnect with this month?</button>'}
    </div>
    ${q.length ? `<div class="quiet-list">${q.map(row).join('')}</div>`
      : '<div class="muted" style="margin-top:8px">Nobody is going quiet. You\'ve been in touch with everyone in the last 2 weeks.</div>'}
  </div>`;
}

// "Label: text" blocks (how prep and follow-up answers are stored), in the order given.
function blocks(body, labels) {
  const re = new RegExp(`^(${labels.map(l => l.replace(/[.*+?^${}()|[\]\\']/g, '\\$&')).join('|')}):\\s*`, 'gm');
  const hits = [...(body || '').matchAll(re)];
  return hits.map((h, i) => ({ label: h[1], text: body.slice(h.index + h[0].length, hits[i + 1]?.index ?? body.length).trim() }));
}
// Bullet or numbered lines become items; plain prose is split into sentences.
function listItems(text) {
  const lines = text.split(/\n+/).map(l => l.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, '').trim()).filter(Boolean);
  return lines.length > 1 ? lines : text.split(/(?<=[.!?])\s+(?=[A-Z])/).map(s => s.trim()).filter(Boolean);
}
const PREP_LABELS = ['Who they are', 'Why Boardy matched you', 'Talking points', 'Questions to ask'];
const FOLLOW_LABELS = ['Why now', 'Follow-up idea'];
// One line for a list: the idea itself, with the reason after it when there's room.
function ideaLine(body) {
  const b = blocks(body, FOLLOW_LABELS);
  const idea = b.find(x => x.label === 'Follow-up idea')?.text, why = b.find(x => x.label === 'Why now')?.text;
  return idea ? (why ? `${idea} — ${why}` : idea) : body;
}

// Network tab: everyone you have met, as cards. Search filters the list.
function network() {
  if (!S.people.length) return '<div class="tile">No one on record yet.</div>';
  return `<div class="row"><h2 style="margin:0">${S.people.length} people</h2><span class="spacer"></span>
    <input id="filter" placeholder="Search name, role, company" style="max-width:280px">
    <button class="btn primary" data-outreach>Write to everyone</button>
    <button class="btn" data-export="md">Export all · Markdown</button><button class="btn" data-export="csv">CSV</button></div>
    <div id="plist" class="list" style="margin-top:14px">${peopleList(S.people)}</div>`;
}

const peopleList = ps => ps.map(p => `<div class="card stat-tile" data-person="${esc(p.email)}">
  <div class="row" style="flex-wrap:nowrap"><div class="avatar sm">${esc(initials(p.name || p.email))}</div>
    <div style="min-width:0;flex:1"><div style="font-weight:600">${esc(p.name || p.email)}</div>
    <div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.title || p.company || p.email)}</div></div>${badges(p.email)}</div>
  <div class="muted" style="margin-top:10px">${p.notes ? `${p.notes} note${p.notes > 1 ? 's' : ''} · ` : ''}${p.last_meeting ? `met ${rel(p.last_meeting)}` : p.meetings ? 'met through Boardy · date unknown' : 'not met yet'}</div></div>`).join('');

function steps() {
  if (!S.nextSteps.length) return '<div class="tile">No next steps yet. Add one to a note when there is one.</div>';
  const open = S.nextSteps.filter(s => !s.done), done = S.nextSteps.filter(s => s.done);
  const item = s => `<div class="card row" style="flex-wrap:nowrap">
    <input type="checkbox" style="width:18px;height:18px;flex:none;accent-color:var(--accent)" data-done="${s.id}" ${s.done ? 'checked' : ''}>
    <div style="flex:1;min-width:0"><div style="${s.done ? 'text-decoration:line-through;opacity:.55' : ''}">${esc(s.next_step)}</div>
    <div class="muted"><span class="link" data-person="${esc(s.email)}">${esc(s.name || s.email)}</span> · ${fmt(s.occurred_at)}</div></div></div>`;
  return `<h2 style="margin-top:0">Open · ${open.length}</h2><div class="list">${open.map(item).join('') || '<div class="empty">All done.</div>'}</div>
    ${done.length ? `<h2>Done · ${done.length}</h2><div class="list">${done.map(item).join('')}</div>` : ''}`;
}


// Opens a Gmail draft to this one person, in the account you send from. You write and send it yourself.
function composeUrl(to) {
  const u = new URL('https://mail.google.com/mail/');
  u.search = new URLSearchParams({ view: 'cm', fs: '1', to, ...(S.sendFrom ? { authuser: S.sendFrom } : {}) });
  return u.toString();
}

// Turns one of Boardy's long paragraphs into something you can scan: the first sentence as a lead line,
// the rest as short bullets (extra ones fold under "Show more"), with numbers and years in bold.
function scan(label, text, keep = 3) {
  const sentences = text.replace(/\s+/g, ' ').trim()
    .split(/(?<=[.!?])\s+(?=[A-Z"“(])/).map(s => s.trim()).filter(Boolean);
  // Bold numbers in text, but never inside an HTML entity (&#39;) or a link (href="...", the URL text).
  const em = s => linkify(s).split(/(<a [^>]*>.*?<\/a>|&#?\w+;)/).map((part, i) => i % 2 ? part
    : part.replace(/(?<![\w/.-])((?:\$|US\$|CA\$)?\d(?:[\d,.]*\d)?\+?(?:\s?(?:%|k|K|M|B|years?|yrs?))?)(?![\w/-])/g, '<b>$1</b>')).join('');
  const [lead, ...rest] = sentences;
  const shown = rest.slice(0, keep), hidden = rest.slice(keep);
  return `${label ? `<div class="sec-label">${esc(label)}</div>` : ''}
    <div class="lead">${em(lead || '')}</div>
    ${shown.length ? `<ul class="pts">${shown.map(s => `<li>${em(s)}</li>`).join('')}</ul>` : ''}
    ${hidden.length ? `<details class="more"><summary>Show ${hidden.length} more</summary><ul class="pts">${hidden.map(s => `<li>${em(s)}</li>`).join('')}</ul></details>` : ''}`;
}

// Person page. Reading order follows what you need: who they are -> what to do next -> details.
//   Header: identity + one primary action (Email); secondary actions in a "⋯" menu; Delete is never one click away.
//   Left:   Boardy's brief as one readable column, with "Worth following up on" pulled to the top; meetings; sources.
//   Right:  next steps, then an inline note box (no extra dialog), then your notes.
async function showPerson(email) {
  const p = await api('/api/person' + qs({ email }));
  if (S.unread[email]) { delete S.unread[email]; render(); } // the server marked them read
  const now = new Date().toISOString();
  const meetings = p.entries.filter(e => e.kind === 'meeting').reverse();
  const past = meetings.filter(m => !m.occurred_at || m.occurred_at < now); // undated = met through Boardy, date unknown
  const upcoming = meetings.filter(m => m.occurred_at && m.occurred_at >= now).reverse();
  const brief = id => p.entries.find(e => e.kind === 'brief' && e.ref_id === id);
  const notes = p.entries.filter(e => e.kind === 'note').reverse();
  const sources = p.entries.filter(e => ['boardy', 'sent', 'ask'].includes(e.kind)).reverse();
  const meetingTitle = id => meetings.find(m => m.ref_id === id)?.title;
  const srcLabel = { boardy: 'Boardy email', sent: 'Sent to Boardy', ask: 'Asked Boardy' };
  const first = (p.name || '').split(' ')[0] || 'them';
  const noEmail = email.endsWith('@no-email.boardy');
  const E = esc(email);

  // The latest meeting with a brief leads; that's the brief you read.
  const lead = past.find(m => brief(m.ref_id));
  const leadBrief = lead && brief(lead.ref_id);
  const sections = leadBrief && briefSections(leadBrief.body);
  const askRef = (lead || past[0] || meetings[0])?.ref_id || '';
  const para = t => t.split(/\n\s*\n/).map(x => `<p>${linkify(x)}</p>`).join('');

  // Status line under the name: when you met, or when you're meeting.
  const metLine = upcoming[0] ? `<span class="chip">Meeting ${rel(upcoming[0].occurred_at)} · ${fmt(upcoming[0].occurred_at)}</span>`
    : past[0]?.occurred_at ? `<span class="chip done">Met ${fmt(past[0].occurred_at)}</span>`
    : past[0] ? '<span class="chip">Met through Boardy · date unknown</span>' : '';

  // ---- Boardy's brief ----
  let briefBlock;
  if (!lead) {
    briefBlock = `<div class="pempty">
      <div style="font-weight:600;font-size:15px">No brief from Boardy yet</div>
      <div class="muted" style="margin:4px 0 12px">Ask Boardy who ${esc(first)} is and why you were matched. The answer fills in here.</div>
      <div class="row" style="justify-content:center">${askRef ? `<button class="btn primary" data-ask="${esc(askRef)}" data-email="${E}">Ask Boardy</button>
        <button class="btn" data-brief="${esc(askRef)}" data-email="${E}">Paste a brief</button>` : ''}</div></div>`;
  } else {
    const get = label => sections?.find(s => s.label === label)?.body;
    const srcLine = `<div class="row muted src-line">${leadBrief.unread ? '<span class="tag new">new</span>' : ''}
      ${leadBrief.source === 'manual' ? 'Pasted by you' : 'From Boardy'} · ${esc(lead.title)}${lead.occurred_at ? ' · ' + fmt(lead.occurred_at) : ''}
      <span class="spacer"></span><button class="btn ghost" data-brief="${esc(lead.ref_id)}" data-email="${E}">Edit brief</button></div>`;
    if (sections) {
      const follow = get('Worth following up on'), why = get('Why Boardy matched you');
      const who = get('Who they are'), work = get("What they're working on");
      briefBlock = `
        ${follow || why ? `<div class="brief-top">
          ${follow ? `<div class="callout">${scan('Worth following up on', follow, 4)}</div>` : ''}
          ${why ? `<div class="why">${scan('Why Boardy matched you', why, 3)}</div>` : ''}
        </div>` : ''}
        ${who || work ? `<div class="brief-cols">
          ${who ? `<div class="brief-card">${scan('Who they are', who, 3)}</div>` : ''}
          ${work ? `<div class="brief-card">${scan("What they're working on", work, 3)}</div>` : ''}
        </div>` : ''}
        ${srcLine}`;
    } else {
      // A pasted free-text recap: same scannable treatment, one card.
      briefBlock = `<div class="brief-card">${leadBrief.body.split(/\n\s*\n/).map((par, i) => {
        const m = par.match(/^([^:\n]{3,40}):\s*([\s\S]*)$/);
        return scan(m ? m[1] : (i ? '' : 'Recap'), m ? m[2] : par, 3);
      }).join('<div style="height:14px"></div>')}</div>${srcLine}`;
    }
  }

  // ---- Prep for the next meeting (Boardy, sent automatically 2 days ahead) ----
  const nextUp = upcoming[0];
  let prepBlock = '';
  if (nextUp) {
    const prep = p.entries.find(e => e.kind === 'prep' && e.ref_id === nextUp.ref_id);
    const requested = S.meetings.find(m => m.eventId === nextUp.ref_id)?.prepRequested;
    const head = `<div class="row"><h4 style="margin:0">Prep for ${fmt(nextUp.occurred_at)}</h4><span class="spacer"></span>`;
    if (prep) {
      const b = blocks(prep.body, PREP_LABELS);
      const get = l => b.find(x => x.label === l)?.text;
      const list = (label, items) => items.length ? `<div class="prep-col"><div class="sec-label">${label}</div><ul class="pts" style="margin-top:4px">${items.map(i => `<li>${linkify(i)}</li>`).join('')}</ul></div>` : '';
      prepBlock = `${head}${prep.unread ? '<span class="tag new">new</span>' : ''}</div>
        <div class="prep-card">
          <div class="prep-grid">${list('Talking points', get('Talking points') ? listItems(get('Talking points')) : [])}
            ${list('Questions to ask', get('Questions to ask') ? listItems(get('Questions to ask')) : [])}</div>
          ${!b.length ? `<div class="brief">${briefHtml(prep.body)}</div>` : ''}
        </div>`;
    } else {
      prepBlock = `${head}</div><div class="prep-card row">
        <span class="muted">${requested ? 'Boardy is preparing talking points and questions for this call.' : 'Boardy preps you automatically 2 days before the call.'}</span>
        <span class="spacer"></span>${requested ? '' : `<button class="btn" data-prep="${esc(nextUp.ref_id)}" data-email="${E}">Prep me now</button>`}</div>`;
    }
    prepBlock += '<div style="height:24px"></div>';
  }

  // ---- Boardy's latest follow-up idea (from Going quiet / reconnect) ----
  const idea = p.entries.filter(e => e.kind === 'followup').sort((a, b) => b.occurred_at.localeCompare(a.occurred_at))[0];
  const ideaBlock = idea && !nextUp ? `<div class="idea">
      <div class="sec-label">${idea.title === 'reconnect' ? 'Boardy says: reconnect this month' : 'Follow-up idea from Boardy'} · ${fmt(idea.occurred_at.slice(0, 10))}</div>
      ${blocks(idea.body, FOLLOW_LABELS).map(x => `<div style="margin-top:4px"><b>${esc(x.label)}:</b> ${linkify(x.text)}</div>`).join('') || linkify(idea.body)}
    </div>` : '';

  // ---- Opportunities: a compact, folding list under the brief ----
  const opps = p.entries.filter(e => e.kind === 'opp').sort((a, b) => a.done - b.done || b.occurred_at.localeCompare(a.occurred_at));
  const openOpps = opps.filter(o => !o.done).length;
  const oppsBlock = `<details class="opps" ${openOpps ? 'open' : ''}>
    <summary class="row"><span class="sec-label" style="margin:0">Opportunities · ${openOpps}${opps.length > openOpps ? ` <span style="font-weight:400">(${opps.length - openOpps} done)</span>` : ''}</span>
      <span class="spacer"></span><span class="muted" style="font-size:12px">roles, projects, events</span></summary>
    <div class="opp-list">
      ${opps.map(o => `<div class="opp">
        <input type="checkbox" data-done="${o.id}" data-email="${E}" ${o.done ? 'checked' : ''} title="Done" aria-label="Mark done">
        <span style="flex:1;${o.done ? 'text-decoration:line-through;opacity:.55' : ''}">${linkify(o.body)}</span>
        <span class="muted" style="font-size:12px">${o.title === 'you' ? 'you' : 'Boardy'}</span>
        <button class="btn ghost" data-oppdel="${o.id}" data-email="${E}" title="Remove" aria-label="Remove opportunity">${ic('close')}</button></div>`).join('')}
      <div class="row" style="flex-wrap:nowrap;gap:6px;margin-top:6px">
        <input id="oppText" placeholder="Add an opportunity (a role, a project, an event…)" style="font-size:13px;padding:7px 10px">
        <button class="btn" id="oppAdd" data-email="${E}">Add</button></div>
    </div></details>`;

  // ---- Meetings: one compact row each, newest first ----
  const meetingRow = m => {
    const b = brief(m.ref_id), isUp = m.occurred_at && m.occurred_at >= now;
    const hasNote = notes.some(n => n.event_ref === m.ref_id);
    return `<div class="tl">
      <div class="tl-date">${m.occurred_at ? fmtDay(m.occurred_at) : 'Date unknown'}</div>
      <div class="tl-title">${esc(m.title)}</div>
      <div class="row" style="gap:6px">
        ${isUp ? '<span class="chip">Upcoming</span>' : `${b ? '<span class="chip done">Brief</span>' : ''}${hasNote ? '<span class="chip done">Notes</span>' : '<span class="chip warn">Needs notes</span>'}`}
        ${!isUp && !b && m !== lead ? `<button class="btn ghost" data-ask="${esc(m.ref_id)}" data-email="${E}">Ask Boardy</button>` : ''}
      </div></div>`;
  };

  // ---- Right column ----
  const steps = notes.filter(n => n.next_step);
  const sentFor = n => p.entries.filter(e => e.kind === 'sent' && String(e.ref_id || '').startsWith(`sent-note-${n.id}-`)).map(e => e.occurred_at).sort().at(-1);
  const noteItem = n => { const sentAt = sentFor(n); return `<div class="note">
    <div class="row" style="flex-wrap:nowrap"><span class="muted" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${fmt(n.occurred_at)}${n.event_ref && meetingTitle(n.event_ref) ? ` · ${esc(meetingTitle(n.event_ref))}` : ''}</span><span class="spacer"></span>
      <span class="note-actions" style="display:flex;gap:2px;flex:none"><button class="btn ghost" data-editnote="${n.id}" data-email="${E}">Edit</button>
      <button class="btn ${sentAt ? 'ghost' : ''}" data-send="${n.id}" data-email="${E}">${sentAt ? 'Send again' : 'Send to Boardy'}</button></span></div>
    <div class="${sentAt ? 'sent-mark' : 'sent-mark no'}">${sentAt ? `Sent to Boardy · ${fmtDay(sentAt)}` : 'Not sent to Boardy yet'}</div>
    <div class="note-body">${linkify(n.body.trim())}</div>
    ${n.next_step ? `<div class="muted" style="margin-top:6px">Next step: ${esc(n.next_step)}${n.done ? ' (done)' : ''}</div>` : ''}</div>`; };
  const defaultRef = (upcoming.length && !past.length ? upcoming[0] : past[0])?.ref_id || '';

  openDlg(`<div class="pwrap">
    <div class="phead">
      <div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:14px">
        <div class="avatar" style="width:56px;height:56px;font-size:20px">${esc(initials(p.name || p.email))}</div>
        <div style="min-width:0;flex:1">
          <div class="hero-name" style="margin:0">${esc(p.name || p.email)}</div>
          ${p.title ? `<div class="ptitle">${esc(p.title)}</div>` : ''}
          <div class="row" style="gap:6px;margin-top:8px">${metLine}${badges(email)}
            <span class="muted">${noEmail ? 'No email from Boardy' : E}${p.company ? ' · ' + esc(p.company) : ''}</span></div>
        </div>
        <div class="row" style="gap:6px;flex-wrap:nowrap">
          ${p.linkedin ? `<a class="btn" href="${esc(p.linkedin)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">LinkedIn ↗</a>` : ''}
          ${noEmail ? '' : `<a class="btn primary" href="${esc(composeUrl(email))}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">Email ${esc(first)}</a>`}
          <details class="menu"><summary class="btn ghost" title="More actions" aria-label="More actions">${ic('more')}</summary>
            <div class="menu-pop">
              ${askRef ? `<button data-ask="${esc(askRef)}" data-email="${E}">Ask Boardy about ${esc(first)}</button>` : ''}
              <button data-linkedin="${E}">${p.linkedin ? 'Change LinkedIn link' : 'Add LinkedIn link'}</button>
              <button data-export="md" data-email="${E}">Export as Markdown</button>
              <hr><button class="danger" data-forget="${E}">Delete record…</button>
            </div></details>
          <button class="btn ghost" data-close title="Close (Esc)" aria-label="Close">${ic('close')}</button>
        </div>
      </div>
    </div>

    <div class="pgrid">
      <div class="pleft">
        <div class="pcol">
          ${prepBlock}
          <h4>Boardy's brief</h4>
          ${ideaBlock}
          ${briefBlock}
          ${oppsBlock}
          ${meetings.length ? `<h4 style="margin-top:28px">Meetings · ${meetings.length}</h4><div class="tl-list">${meetings.map(meetingRow).join('')}</div>` : ''}
          ${sources.length ? `<details class="sources"><summary class="row"><h4 style="margin:0">Source emails · ${sources.length}</h4><span class="spacer"></span><span class="muted">show</span></summary>
            <div class="stack" style="margin-top:10px">${sources.map(e => `<div class="note"><div class="row"><span class="tag">${srcLabel[e.kind]}</span><strong style="font-weight:600">${esc(e.title || '')}</strong>
              <span class="spacer"></span><span class="muted">${fmt(e.occurred_at)}</span></div>${e.body ? `<pre>${linkify(e.body)}</pre>` : ''}</div>`).join('')}</div></details>` : ''}
        </div>
      </div>

      <aside class="pright">
        ${steps.length ? `<h4>Next steps</h4><div class="steps">
          ${steps.map(n => `<label class="step"><input type="checkbox" data-done="${n.id}" data-email="${E}" ${n.done ? 'checked' : ''}>
            <span style="${n.done ? 'text-decoration:line-through;opacity:.55' : ''}">${esc(n.next_step)}</span></label>`).join('')}</div>` : ''}

        <h4 ${steps.length ? 'style="margin-top:24px"' : ''}>Add a note</h4>
        <div class="composer">
          <textarea id="qNote" placeholder="What did you learn? What do you want to remember about ${esc(first)}?"></textarea>
          <input id="qNext" placeholder="Next step (optional)">
          <div class="row" style="gap:6px;flex-wrap:nowrap">
            ${meetings.length ? `<select id="qEvent" aria-label="Which meeting this note is about" style="flex:1;min-width:0">
              <option value="">Not about a meeting</option>
              ${meetings.map(m => `<option value="${esc(m.ref_id)}" ${m.ref_id === defaultRef ? 'selected' : ''}>${esc(m.title)}${m.occurred_at ? ' · ' + fmtDay(m.occurred_at) : ''}</option>`).join('')}
            </select>` : '<span class="spacer"></span>'}
            <button class="btn primary" id="qSave" data-email="${E}" title="Ctrl+Enter">Save note</button>
          </div>
        </div>

        <h4 style="margin-top:24px">Notes · ${notes.length}</h4>
        <div class="stack">${notes.map(noteItem).join('') || '<div class="muted">No notes yet.</div>'}</div>
      </aside>
    </div>
  </div>`, true);
}

// Boardy's structured answers are stored as "Label: text" blocks; each known label becomes its own section.
// Anything else (e.g. a pasted text-message recap) shows as paragraphs, with a short leading "Label:" in bold.
const SECTIONS = ['Who they are', "What they're working on", 'Why Boardy matched you', 'Worth following up on'];
function briefSections(text) {
  const re = new RegExp(`^(${SECTIONS.map(s => s.replace(/[.*+?^${}()|[\]\\']/g, '\\$&')).join('|')}):\\s*`, 'gm');
  const hits = [...text.matchAll(re)];
  if (hits.length < 2) return null;
  return hits.map((h, i) => ({ label: h[1], body: text.slice(h.index + h[0].length, hits[i + 1]?.index ?? text.length).trim() }));
}
function briefHtml(text) {
  const sections = briefSections(text);
  if (sections) {
    return sections.map(s => `<div class="section"><div class="label">${esc(s.label)}</div>${s.body.split(/\n\s*\n/).map(p => `<p>${linkify(p)}</p>`).join('')}</div>`).join('');
  }
  return text.split(/\n\s*\n/).map(par => {
    const m = par.match(/^([^:\n]{3,40}):\s*([\s\S]*)$/);
    return m ? `<p><strong>${esc(m[1])}:</strong> ${linkify(m[2])}</p>` : `<p>${linkify(par)}</p>`;
  }).join('');
}

// The person page uses the wide bento dialog; editors and settings use a narrow one.
// ---- Outreach: one template, filled in per person, saved as Gmail drafts you send yourself. ----
const OUTREACH_KEY = 'nq_outreach';
const OUTREACH_DEFAULT = {
  subject: 'Quick favour, {first_name}?',
  body: `Hi {first_name},

Hope things are good at {company}. We met {met_when} ({meeting}) and I've been meaning to follow up.

I just launched something I've been building: [product + one line on what it does, link]. Since you know [the space / what you do], I'd really value your honest take. What works, what's confusing, what you'd change.

No pressure at all, even a two-line reply would help.

Thanks,
Harsh`,
};
const firstName = p => (p.name || '').trim().split(/\s+/)[0] || '';
function metWhen(d) {
  if (!d) return '';
  const days = (Date.now() - new Date(d)) / 86400000;
  if (days < 0) return 'recently';
  if (days < 8) return 'last week';
  if (days < 30) return 'a few weeks ago';
  const dt = new Date(d), sameYear = dt.getFullYear() === new Date().getFullYear();
  return 'in ' + dt.toLocaleDateString([], sameYear ? { month: 'long' } : { month: 'long', year: 'numeric' });
}
const outreachFields = p => ({ first_name: firstName(p), name: p.name || '', company: p.company || '', title: p.title || '', met_when: metWhen(p.met), meeting: p.meeting });
// Fills {field}; reports which fields came out empty so you can fix that email by hand.
function fillTemplate(tpl, p) {
  const f = outreachFields(p), missing = new Set();
  const out = tpl.replace(/\{(\w+)\}/g, (m, k) => { if (!(k in f)) return m; if (!f[k]) missing.add(k); return f[k]; });
  return { text: out, missing: [...missing] };
}

  if (!S.sendFrom) return notify('Choose a sending account under "Accounts & Boardy" first.');
  const [people, status] = await Promise.all([api('/api/outreach'), api('/api/outreach-status')]);
  if (status?.drafts) return previewOutreach(status.people.map(sp => {
    const p = people.find(x => x.email === sp.email) || sp, d = status.drafts[sp.email];
    return { p, subject: d?.subject || '', text: d?.text || '', missing: d ? [] : ['Boardy left this one out'] };
  }), { boardy: true });
  if (status) return openDlg(`<h3 style="margin:0">Waiting for Boardy</h3>
    <div class="muted">Asked ${esc(rel(status.sentAt))} to write ${status.people.length} emails. They'll show up here once Boardy replies${S.live ? '' : ' (press Check now, or Sync)'}.</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="oReset">Start over</button><span class="spacer"></span>
    <button class="btn" data-close>Close</button><button class="btn primary" id="oCheck">Check now</button></div>`);
  let tpl = OUTREACH_DEFAULT;
  try { tpl = { ...tpl, ...JSON.parse(localStorage.getItem(OUTREACH_KEY)) }; } catch {}
  openDlg(`<h3 style="margin:0">Write to everyone</h3>
    <div class="muted">Boardy writes a personal email to each person from what it knows about them. Nothing goes to them yet: the emails become drafts in ${esc(S.sendFrom)} for you to review and send from Gmail.</div>
    <label>What are you reaching out about?</label>
    <textarea id="oPitch" style="min-height:120px" placeholder="I launched Swarmie today: [what it does, link]. I'd love honest feedback from people who know [the space]: what works, what's confusing, what they'd change.">${esc(tpl.pitch || '')}</textarea>
    <div class="row" style="margin-top:14px"><label style="margin:0">Who · <span id="oCount"></span></label><span class="spacer"></span>
      <button class="btn" id="oAll">All</button><button class="btn" id="oNone">None</button></div>
    <div id="oPeople" style="max-height:220px;overflow:auto;margin-top:6px">${people.map((p, i) => `<label class="row" style="flex-wrap:nowrap;margin:4px 0;font-weight:400">
      <input type="checkbox" data-i="${i}" checked style="width:16px;height:16px;flex:none;accent-color:var(--accent)">
      <span>${esc(p.name || p.email)} <span class="muted">${esc(p.company || p.email)}</span></span></label>`).join('')}</div>
    <details style="margin-top:14px"><summary class="muted">Or write one template yourself</summary>
      <label>Subject</label><input id="oSubj" value="${esc(tpl.subject)}">
      <label>Message</label><textarea id="oBody" style="min-height:220px">${esc(tpl.body)}</textarea>
      <div class="muted">Fields: {first_name} {name} {company} {title} {met_when} {meeting}</div>
      <div class="row" style="margin-top:8px"><span class="spacer"></span><button class="btn" id="oNext">Preview from template</button></div></details>
    <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn" data-close>Cancel</button>
    <button class="btn primary" id="oAsk">Ask Boardy to write them</button></div>`, true);
  const boxes = () => [...document.querySelectorAll('#oPeople input')];
  const picked = () => boxes().filter(b => b.checked).map(b => people[b.dataset.i]);
  const count = () => { $('#oCount').textContent = `${picked().length} of ${people.length}`; };
  const save = () => { try { localStorage.setItem(OUTREACH_KEY, JSON.stringify({ pitch: $('#oPitch').value, subject: $('#oSubj').value, body: $('#oBody').value })); } catch {} };
  count();
  $('#oPeople').onchange = count;
  $('#oAll').onclick = () => { boxes().forEach(b => b.checked = true); count(); };
  $('#oNone').onclick = () => { boxes().forEach(b => b.checked = false); count(); };
  $('#oNext').onclick = () => {
    save();
    if (!picked().length) return notify('Pick at least one person.');
    previewOutreach(picked().map(p => {
      const s = fillTemplate($('#oSubj').value, p), b = fillTemplate($('#oBody').value, p);
      return { p, subject: s.text, text: b.text, missing: [...new Set([...s.missing, ...b.missing])] };
    }));
  };
  $('#oAsk').onclick = async e => {
    save();
    if (!$('#oPitch').value.trim()) return notify('Say what you are reaching out about first.');
    if (!picked().length) return notify('Pick at least one person.');
    e.target.disabled = true; e.target.textContent = 'Asking…';
    try {
      await api('/api/outreach-ask', { pitch: $('#oPitch').value, emails: picked().map(p => p.email) });
      $('#dlg').close();
      notify(`Asked Boardy to write ${picked().length} emails. Open "Write to everyone" again once it replies.`);
    } catch (err) { notify(err.message, 'error'); e.target.disabled = false; e.target.textContent = 'Ask Boardy to write them'; }
  };
}

function previewOutreach(drafts, { boardy = false } = {}) {
  const flagged = drafts.filter(d => d.missing.length).length;
  openDlg(`<h3 style="margin:0">${drafts.length} drafts${boardy ? ' from Boardy' : ''}</h3>
    <div class="muted">Edit any of them. Clear an email to skip that person.${flagged ? ` ${flagged} need a look, marked below.` : ''}${drafts.some(d => d.p.note) ? ' Your last note on each person is shown for reference.' : ''}</div>
    <div class="list" style="margin-top:12px">${drafts.map((d, i) => `<div class="card">
      <div class="row"><b>${esc(d.p.name || d.p.email)}</b><span class="muted">${esc(d.p.email)}</span><span class="spacer"></span>
        ${d.missing.length ? `<span style="color:var(--warn)">${boardy ? esc(d.missing[0]) : 'empty: ' + esc(d.missing.join(', '))}</span>` : ''}</div>
      ${d.p.note ? `<div class="muted" style="margin-top:6px">Your note: ${esc(d.p.note.slice(0, 240))}</div>` : ''}
      <input data-os="${i}" value="${esc(d.subject)}" placeholder="Subject" style="margin-top:8px">
      <textarea data-ot="${i}" style="min-height:180px;margin-top:6px">${esc(d.text)}</textarea></div>`).join('')}</div>
    <div class="row" style="margin-top:14px">${boardy ? '<button class="btn" id="oReset">Start over</button>' : '<button class="btn" id="oBack">Back</button>'}<span class="spacer"></span>
    <button class="btn primary" id="oSave">Save drafts to Gmail</button></div>`, true);
  if (!boardy) $('#oBack').onclick = showOutreach;
  $('#oSave').onclick = async e => {
    const items = drafts.map((d, i) => ({ to: d.p.email, subject: $(`[data-os="${i}"]`).value, text: $(`[data-ot="${i}"]`).value }));
    if (items.some(i => !i.subject.trim() && i.text.trim())) return notify('Some drafts have no subject. Add one, or clear that email to skip it.', 'error');
    e.target.disabled = true; e.target.textContent = 'Saving…';
    try {
      const r = await api('/api/outreach-drafts', { items });
      if (boardy) await api('/api/outreach-clear', {});
      $('#dlg').close();
      notify(`Saved ${r.count} drafts in ${r.from}. Open Gmail Drafts to send them.`);
    } catch (err) { notify(err.message, 'error'); e.target.disabled = false; e.target.textContent = 'Save drafts to Gmail'; }
  };
}

function openDlg(html, wide = false) {
  const d = $('#dlg');
  d.classList.toggle('narrow', !wide);
  d.classList.toggle('wide', wide);
  d.innerHTML = html;
  if (!d.open) d.showModal();
  d.scrollTop = 0;
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-cal],[data-person],[data-addnote],[data-editnote],[data-brief],[data-send],[data-ask],[data-linkedin],[data-forget],[data-outreach],[data-close]');
  if (!t) return;
  if (t.dataset.outreach !== undefined) return showOutreach();
  if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  else if (t.dataset.cal !== undefined) { calOffset = t.dataset.cal === '0' ? 0 : calOffset + Number(t.dataset.cal); render(); }
  else if (t.dataset.linkedin) {
    const url = prompt('LinkedIn profile link (leave empty to remove):', $('#dlg a[href*="linkedin.com"]')?.href || '');
    if (url === null) return;
    try { await api('/api/linkedin', { email: t.dataset.linkedin, url }); showPerson(t.dataset.linkedin); }
    catch (err) { notify(err.message, 'error'); }
  }
  else if (t.dataset.person) showPerson(t.dataset.person);
  else if (t.dataset.addnote) showNote(t.dataset.addnote, { eventRef: t.dataset.event });
  else if (t.dataset.editnote) showNote(t.dataset.email, { id: Number(t.dataset.editnote) });
  else if (t.dataset.brief) showBrief(t.dataset.email, t.dataset.brief);
  else if (t.dataset.send) showSend(t.dataset.email, Number(t.dataset.send));
  else if (t.dataset.ask !== undefined) showSend(t.dataset.email, t.dataset.ask, 'ask');
  else if (t.dataset.close !== undefined) $('#dlg').close();
  else if (t.dataset.forget) {
    if (prompt(`Type ${t.dataset.forget} to delete everything stored about them:`) !== t.dataset.forget) return;
    await api('/api/forget', { email: t.dataset.forget }); $('#dlg').close(); await load();
  }
});
document.addEventListener('change', async e => {
