document.addEventListener('click', async e => {
  const t = e.target;
  const row = t.closest('.mail-row');
  if (row) return openMail(row.dataset.inbox, row.dataset.thread);
  // Boardy requests: prep for one meeting, follow-up ideas, monthly reconnect picks.
  if (t.dataset.prep) {
    t.disabled = true; t.textContent = 'Asking Boardy…';
    try { await api('/api/prep', { email: t.dataset.email, eventId: t.dataset.prep }); await load(); if ($('#dlg').open) showPerson(t.dataset.email); }
    catch (err) { notify(err.message, 'error'); t.disabled = false; t.textContent = 'Prep me now'; }
    return;
  }
  if (t.dataset.followups) {
    t.disabled = true; t.textContent = 'Asking Boardy…';
    try { await api('/api/followups', { type: t.dataset.followups }); await load(); }
    catch (err) { notify(err.message, 'error'); await load(); }
    return;
  }
  if (t.id === 'oppAdd') {
    const text = $('#oppText').value.trim();
    if (!text) { $('#oppText').focus(); return; }
    await api('/api/opp', { email: t.dataset.email, text }); return showPerson(t.dataset.email);
  }
  if (t.dataset.oppdel) { await api('/api/opp-delete', { id: Number(t.dataset.oppdel) }); return showPerson(t.dataset.email); }
  // A choice in the "⋯" menu closes it; its own data-* action still runs in the main click handler.
  if (t.closest('.menu-pop')) t.closest('details.menu').open = false;
  // Inline note on the person page.
  if (t.id === 'qSave') {
    const body = $('#qNote').value.trim();
    if (!body) { $('#qNote').focus(); return; }
    t.disabled = true;
    try {
      await api('/api/note', { email: t.dataset.email, body, next_step: $('#qNext').value, eventRef: $('#qEvent')?.value || '' });
      await load(); showPerson(t.dataset.email);
    } catch (err) { notify(err.message, 'error'); t.disabled = false; }
    return;
  }
  if (t.dataset.export) {
    // Built on the server, saved here as a file download.
    try {
      const f = await api('/api/export' + qs({ format: t.dataset.export, ...(t.dataset.email ? { email: t.dataset.email } : {}) }));
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([f.content], { type: f.type })), download: f.filename });
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (err) { notify(err.message, 'error'); }
    return;
  }
  if (t.id === 'mCompose') { mail.composing = true; mail.open = null; renderList(); renderPane(); $('#bMsg').focus(); }
  else if (t.id === 'mDiscard') {
    if (draftText.trim() && !confirm('Discard this draft?')) return;
    draftText = ''; mail.composing = false; renderPane();
  }
  else if (t.id === 'mRefresh') loadChat();
  else if (t.id === 'bTemplate') {
    if ($('#bMsg').value.trim() && !confirm('Replace what you typed with the standard request?')) return;
    $('#bMsg').value = draftText = TEMPLATE; $('#bMsg').focus();
  }
  else if (t.id === 'bSend') {
    const text = $('#bMsg').value.trim();
    if (!text) return notify('Type a message first.');
    if (!S.sendFrom || !S.boardy) return notify('Set the Boardy address and sending account under "Accounts & Boardy".');
    const subject = $('#bSubj').value;
    previewSend({ to: S.boardy, subject, text, run: async () => {
      const r = await api('/api/boardy-message', { text, subject });
      draftText = ''; mail.composing = false; mail.open = { inbox: r.inbox, id: r.id };
      notify('Sent to Boardy.');
      await loadChat();
    } });
  }
  else if (t.id === 'mSendReply') {
    const text = $('#mReply').value.trim();
    if (!text) return notify('Type a reply first.');
    const open = mail.open;
    previewSend({ to: S.boardy, subject: 'Reply in this thread', text, run: async () => {
      await api('/api/reply', { inbox: open.inbox, id: open.id, text }); mail.reply = '';
      notify('Reply sent to Boardy.');
      await openMail(open.inbox, open.id, true); loadChat();
    } });
  }
});

// Ctrl+Enter (Cmd+Enter on Mac) sends from any message box, the same as clicking its Send button.
const SEND_FOR = { bMsg: 'bSend', mReply: 'mSendReply', sText: 'doSend', qNote: 'qSave', qNext: 'qSave' };
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !(e.ctrlKey || e.metaKey)) return;
  const btn = document.getElementById(SEND_FOR[e.target.id]);
  if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'bMsg') draftText = e.target.value;
  if (e.target.id === 'mReply') mail.reply = e.target.value;
  if (e.target.id === 'mFilter') { mail.filter = e.target.value; renderList(); }
  if (e.target.id === 'filter') {
    const q = e.target.value.toLowerCase();
    $('#plist').innerHTML = peopleList(S.people.filter(p => [p.name, p.email, p.company, p.title].join(' ').toLowerCase().includes(q)));
  }
});
let lastSync = null;
const showSynced = () => { $('#synced').textContent = lastSync ? 'Synced ' + lastSync.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }) : ''; };
$('#sync').onclick = async e => {
  e.target.disabled = true; e.target.textContent = 'Syncing…';
  try {
    const r = await api('/api/sync', {});
    if (!r.sendFrom) notify(`No email from boardy.ai found in ${r.accounts.join(', ')}. Connect the account Boardy uses, or set the address under "Accounts & Boardy".`);
    else notify('Synced. Meetings and Boardy emails are up to date.');
    await load();
    lastSync = new Date(); showSynced();
  } catch (err) { notify(err.message, 'error', { label: 'Try again', run: () => $('#sync').click() }); }
  e.target.disabled = false; e.target.textContent = 'Sync';
};
$('#settings').onclick = () => {
  openDlg(`<div class="row"><h3 style="margin:0">Accounts &amp; Boardy</h3><span class="spacer"></span><button class="btn" data-close>Close</button></div>
    <label>Connected Google accounts (Sync reads all of them)</label>
    ${S.accounts.map(a => `<label class="row" style="color:var(--ink);margin:6px 0;cursor:pointer"><input type="radio" name="sendFrom" value="${esc(a)}" style="width:auto" ${a === S.sendFrom ? 'checked' : ''}> ${esc(a)}</label>`).join('') || '<div class="empty">None.</div>'}
    ${S.hosted
      ? `<div class="muted">The selected account is the one notes are sent from.</div>
         <div class="row" style="margin-top:8px"><a class="btn" href="/connect">+ Connect a Google account</a>
           <a class="btn ghost" href="/connect?pubsub=1" title="Use the account that owns your Google Cloud project">+ Connect with live notifications</a>
           <span class="spacer"></span><a class="btn ghost" href="/logout">Sign out</a></div>`
      : `<div class="muted">The selected account is the one notes are sent from. To add another, run <code>node src/cli.js auth</code> in the terminal.</div>`}
    <label>Boardy's email address</label><input id="bAddr" value="${esc(S.boardy || '')}" placeholder="found automatically on Sync">    <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn primary" id="saveSettings">Save</button></div>`);
  $('#saveSettings').onclick = async () => {
    const sendFrom = document.querySelector('input[name=sendFrom]:checked')?.value;
    await api('/api/settings', { boardy: $('#bAddr').value || undefined, sendFrom });
    $('#dlg').close(); await load();
  };
};
// The server pushes an event when Pub/Sub reports a Boardy email; no checking on a timer.
const events = new EventSource('/api/events');
events.onmessage = async e => {
  const ev = JSON.parse(e.data);
  if (ev.type !== 'boardy') return;
  const before = new Set(Object.keys(S.unread));
  await load();
  const fresh = Object.keys(S.unread).filter(k => !before.has(k));
  const names = fresh.map(email => S.people.find(p => p.email === email)?.name || email);
  if (names.length && 'Notification' in window && Notification.permission === 'granted') {
    new Notification('New from Boardy', { body: `About ${names.join(', ')}` });
  }
};
// Browsers only allow asking for notification permission after a click.
document.addEventListener('click', () => {
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}, { once: true });

function start() {
  load().catch(err => {
    $('#view').innerHTML = `<div class="tile" style="max-width:560px"><p style="font-weight:600">Couldn't load your meetings.</p><p class="muted">${esc(err.message)}</p><button class="btn primary" id="retryLoad">Try again</button></div>`;
    $('#retryLoad').onclick = () => { $('#view').innerHTML = '<div class="empty">Loading…</div>'; start(); };
  });
}
start();
</script>
</body>
</html>
