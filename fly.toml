# Fly.io settings. Change `app` to the name you pick in `fly launch` (it must be unique on Fly).
app = "networkquest-harsh"
primary_region = "yyz" # Toronto

[env]
  NQ_HOME = "/data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: live Boardy notifications and automatic prep need the app running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# Permanent disk for the database, Google tokens and settings.
[[mounts]]
  source = "nq_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
